name: 🌍 AFTERSHOCK — Seismic Data Update

on:
  schedule:
    # Hourly. Commits every 6 hours, or straight away when a new M4.5+ arrives —
    # the page also reads the USGS live feed itself, so it is never more than a
    # minute behind for recent quakes.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aftershock-update
  cancel-in-progress: false

jobs:
  fetch-seismic-data:
    name: Fetch USGS Earthquake Data
    runs-on: ubuntu-latest
    steps:
      - name: 📡 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: 🌍 Fetch seismic data from USGS ComCat
        run: |
          pixi run fetch > fetch.log 2>&1 || { cat fetch.log; echo "::error title=fetch_quakes::$(tail -20 fetch.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
          cat fetch.log

      - name: 📊 Commit updated data
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          PREV=$(git show HEAD:data/.commit_hint 2>/dev/null || true)
          NOW=$(cat data/.commit_hint 2>/dev/null || true)
          git add data/
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          HOUR=$(date -u +%H)
          OTHER=$(git diff --staged --name-only | grep -v -e 'data/earthquakes.json' -e 'data/.commit_hint' || true)
          if [ "$PREV" = "$NOW" ] && [ -z "$OTHER" ] && [ $((10#$HOUR % 6)) -ne 0 ] \
             && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "quiet hour — no new M4.5+, not committing"; exit 0
          fi
          git commit -m "🌍 Seismic update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
